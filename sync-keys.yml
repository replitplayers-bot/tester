# ============================================================
#  Sentinel — Key List Sync
#  Place at: .github/workflows/sync-keys.yml
#  in repo: replitplayers-bot/tester
# ============================================================

name: Sync Key List

on:
  repository_dispatch:
    types: [sync-keys]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Write key list from payload
        run: |
          # The key list is sent directly in the dispatch payload
          # No need to fetch from the host — avoids any JS wall issues
          printf '%s' '${{ github.event.client_payload.key_list }}' > list

          echo "Key list updated:"
          cat list

      - name: Commit and push
        run: |
          git config user.name  "sentinel-bot"
          git config user.email "bot@sentinel.rip"
          git add list
          git diff --staged --quiet || git commit -m "chore: sync key list [automated]"
          git push
